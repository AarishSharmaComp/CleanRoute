spring:
  application:
    name: cleanroute-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cleanroute}
    username: ${SPRING_DATASOURCE_USERNAME:cleanroute}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
app:
  web:
    allowed-origins: ${CLEANROUTE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  observations:
    ingestion-interval-ms: ${OBSERVATION_INGESTION_INTERVAL_MS:900000}
    initial-delay-ms: ${OBSERVATION_INGESTION_INITIAL_DELAY_MS:900000}
    provider-timeout-ms: ${OBSERVATION_PROVIDER_TIMEOUT_MS:5000}
    rate-limit-backoff-ms: ${OBSERVATION_RATE_LIMIT_BACKOFF_MS:60000}
  environmental:
    provider: ${ENVIRONMENTAL_PROVIDER:mock}
    open-meteo-url: ${OPEN_METEO_API_URL:https://air-quality-api.open-meteo.com/v1/air-quality}
    connect-timeout-ms: ${ENVIRONMENTAL_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ENVIRONMENTAL_READ_TIMEOUT_MS:5000}
    route-sample-interval-meters: ${ENVIRONMENTAL_ROUTE_SAMPLE_INTERVAL_METERS:250}
  pollution:
    scoring:
      aqi-index-max: 500
      pm25-reference: 35
      pm10-reference: 50
      no2-reference: 40
      so2-reference: 20
      co-reference: 4
      o3-reference: 100
      pollution-weight: 0.75
      traffic-weight: 0.15
      weather-weight: 0.10
      wind-reference-mps: 10
  routing:
    provider: ${ROUTING_PROVIDER:mock}
    osrm-url: ${OSRM_API_URL:https://router.project-osrm.org}
    connect-timeout-ms: ${ROUTING_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ROUTING_READ_TIMEOUT_MS:5000}
    max-geometry-points: ${ROUTING_MAX_GEOMETRY_POINTS:5000}
  routes:
    suitability:
      jogger-minimum-distance-meters: 2000
      jogger-ideal-maximum-distance-meters: 8000
      jogger-maximum-distance-meters: 12000
      jogger-maximum-pollution-exposure: 50
      jogger-maximum-congestion-factor: 2.5
      cyclist-maximum-pollution-exposure: 50
      cyclist-maximum-congestion-factor: 3.0
      pollution-weight: 0.5
      traffic-weight: 0.3
      distance-weight: 0.2
      prefer-green-areas: true
      maximum-elevation-gain-meters: 250
  notifications:
    high-aqi-threshold: 100
    high-pm25-threshold: 35
    cleaner-exposure-improvement: 5
    result-limit: 50
  geocoding:
    provider: ${GEOCODING_PROVIDER:photon}
    photon-url: ${PHOTON_API_URL:https://photon.komoot.io/api/}
    connect-timeout-ms: ${GEOCODING_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${GEOCODING_READ_TIMEOUT_MS:5000}
    coverage-radius-meters: ${GEOCODING_COVERAGE_RADIUS_METERS:35000}
