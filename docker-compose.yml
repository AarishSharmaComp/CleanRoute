services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  backend:
    build: { context: ./backend }
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cleanroute}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cleanroute}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-photon}
      PHOTON_API_URL: ${PHOTON_API_URL:-https://photon.komoot.io/api/}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-mock}
      OSRM_API_URL: ${OSRM_API_URL:-https://router.project-osrm.org}
      VALHALLA_API_URL: ${VALHALLA_API_URL:-https://valhalla1.openstreetmap.de}
      ROUTING_CONNECT_TIMEOUT_MS: ${ROUTING_CONNECT_TIMEOUT_MS:-2000}
      ROUTING_READ_TIMEOUT_MS: ${ROUTING_READ_TIMEOUT_MS:-5000}
      ROUTING_MAX_GEOMETRY_POINTS: ${ROUTING_MAX_GEOMETRY_POINTS:-5000}
      ENVIRONMENTAL_PROVIDER: ${ENVIRONMENTAL_PROVIDER:-mock}
      OPEN_METEO_API_URL: ${OPEN_METEO_API_URL:-https://air-quality-api.open-meteo.com/v1/air-quality}
      ENVIRONMENTAL_CONNECT_TIMEOUT_MS: ${ENVIRONMENTAL_CONNECT_TIMEOUT_MS:-2000}
      ENVIRONMENTAL_READ_TIMEOUT_MS: ${ENVIRONMENTAL_READ_TIMEOUT_MS:-5000}
      ENVIRONMENTAL_ROUTE_SAMPLE_INTERVAL_METERS: ${ENVIRONMENTAL_ROUTE_SAMPLE_INTERVAL_METERS:-250}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
  frontend:
    build: { context: ./frontend }
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
volumes:
  postgres-data:
